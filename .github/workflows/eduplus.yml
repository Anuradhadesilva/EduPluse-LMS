name: Demo Pipeline

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # -----------------------
  # 1. BUILD & PUSH TO DOCKER HUB
  # -----------------------
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms-backend   # 👈 important: build inside this folder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Login to Docker Hub
        run: docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_PASSWORD }}"

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:${{ github.ref_name }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:${{ github.ref_name }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:latest
          fi

  # -----------------------
  # 2. DEPLOY ON EC2 (SELF-HOSTED RUNNER)
  # -----------------------
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted

    steps:
      - name: Check Docker Installation
        run: |
          if ! [ -x "$(command -v docker)" ]; then
            echo "❌ Docker is not installed!" >&2
            exit 1
          fi
          echo "✅ Docker is installed."

      - name: Login to Docker Hub
        run: sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_PASSWORD }}"

      - name: Pull latest image from Docker Hub
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:latest

      - name: Remove existing container
        run: |
          if [ "$(sudo docker ps -aq -f name=demo)" ]; then
            echo "🧹 Removing old container..."
            sudo docker rm -f demo
          fi

      - name: Run new Docker container
        run: |
          echo "🚀 Starting new container..."
          sudo docker run -d \
            --name demo \
            -p 5454:5454 \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.RDS_ENDPOINT }}:3306/lms_db?createDatabaseIfNotExist=true \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.RDS_USERNAME }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.RDS_PASSWORD }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/eduplus-lms:latest
